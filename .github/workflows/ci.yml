name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wasm-gc:
    name: check and test on wasm-gc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check (deny warnings)
        run: moon check --target wasm-gc --deny-warn

      - name: Test
        run: moon test --target wasm-gc
