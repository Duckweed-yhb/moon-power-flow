name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: moon fmt --check
        run: moon fmt --check

  build-and-test:
    name: check & test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 求解器不含 C FFI，三个目标的数值行为应当一致（浮点末位差异走容差断言）；
        # 逐个跑，让「跨后端可用」是构建期事实而不是声明。
        target: [wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1

      - name: Check (deny warnings)
        run: moon check --target ${{ matrix.target }} --deny-warn

      - name: Build
        run: moon build --target ${{ matrix.target }}

      - name: Test
        run: moon test --target ${{ matrix.target }}

  examples:
    name: run examples (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@v1
      - name: Run examples/dist_demo (three-phase sweep)
        run: moon run examples/dist_demo --target native
      - name: Run examples/demo (single-phase GS baseline)
        run: moon run examples/demo --target native

  release-meta:
    name: release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # moon.mod 的 version、CHANGELOG 最新段标题、README 的安装版本三处必须一致。
      # 发布时漏改任何一处都不会报错，只会让文档变成谎话——用脚本挡在这里。
      - name: Check version / CHANGELOG / README consistency
        shell: pwsh
        run: ./scripts/check-release.ps1
